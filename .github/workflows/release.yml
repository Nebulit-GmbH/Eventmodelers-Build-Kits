name: Release CLI + agent images

# Pushing a version tag (v1.2.3) publishes two things from the same commit:
#   1. the @eventmodelers/cli npm package
#   2. the agent docker images, to ghcr.io/nebulit-gmbh (multi-arch: amd64 + arm64)
#
# The tag must equal package.json's version (v1.0.98 <-> "1.0.98"), so the package, the images
# and the git tag can never disagree. Bump the version and commit before tagging.
#
# The images run the CLI from this checkout (not from npm), so they don't wait on the npm publish.
#
# Secrets (repo settings):
#   NPM_TOKEN — an npm automation token allowed to publish @eventmodelers/cli
# The images use the built-in GITHUB_TOKEN: this repo lives in the Nebulit-GmbH org, the same
# namespace the images are pushed to. Packages are private on first push — flip them to public
# in the org's package settings once if the images should be pullable without a login.
#
# arm64 builds on the native ubuntu-24.04-arm runner, not under QEMU (see the platform repo's
# publish-images.yml: emulated builds hang silently). Each image/platform pair is built, scanned
# for credentials, pushed by digest, and a merge job stitches both digests into one manifest list.
on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  OWNER: nebulit-gmbh

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eventmodelers-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eventmodelers-cli/package-lock.json

      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: npm ci
      - run: npm test

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: eventmodelers-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci --omit=dev

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  images:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        image:
          - { name: eventmodelers-agent-claude, dockerfile: claude }
          - { name: eventmodelers-agent-opencode, dockerfile: opencode }
          - { name: em-studio-buildkit-claude-node, dockerfile: build-with-claude-node }
          - { name: em-studio-buildkit-claude-java, dockerfile: build-with-claude-java }
          - { name: em-studio-buildkit-opencode-node, dockerfile: build-with-opencode-node }
          - { name: em-studio-buildkit-opencode-java, dockerfile: build-with-opencode-java }
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local daemon first so the credential scan runs on exactly what gets pushed.
      # The push build below reuses every layer from the cache.
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./eventmodelers-cli
          file: ./eventmodelers-cli/docker/${{ matrix.image.dockerfile }}/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: scan/${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=${{ env.IMAGE }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}-${{ env.PLATFORM_PAIR }}

      - name: Scan image for credentials
        run: .github/scripts/scan-image.sh scan/${{ env.IMAGE }}:ci

      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./eventmodelers-cli
          file: ./eventmodelers-cli/docker/${{ matrix.image.dockerfile }}/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=${{ env.IMAGE }}-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.IMAGE }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - eventmodelers-agent-claude
          - eventmodelers-agent-opencode
          - em-studio-buildkit-claude-node
          - em-studio-buildkit-claude-java
          - em-studio-buildkit-opencode-node
          - em-studio-buildkit-opencode-java
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          image=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          docker buildx imagetools create \
            -t "$image:${GITHUB_REF_NAME}" \
            -t "$image:latest" \
            $(printf "$image@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${GITHUB_REF_NAME}
