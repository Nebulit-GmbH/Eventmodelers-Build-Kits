<script>

</script>

<!-- The prototype kit — hooks for the slice blocks and the chrome. Fixed, never generated. -->
<script type="text/plain" id="em-kit">
const { useState, useContext, createContext, useSyncExternalStore, Component } = React;
const Domain = EMRuntime.domain;
Domain.context = document.body.dataset.emContext;
let rt = null; // created once every slice has registered
let navigateTo = null; // the App's tab switch, for the board's player (see the message contract in emMount)
const Proto = createContext(null);

// Bumped on every change (events, clock, automation runs, time travel).
let version = 0;

/** Re-render on every change to the runtime. */
function useLog() {
  useSyncExternalStore(rt.subscribe, () => version);
  return rt.events;
}

/** The current result of a read model, folded from the in-browser event log. */
function useReadModel(name, params) {
  useLog();
  return rt.query(name, params);
}

/** A command bound to a button: run(data) appends its events or shows the rule that rejected it. */
function useCommand(type) {
  const { toast, actor } = useContext(Proto);
  const [error, setError] = useState(null);
  const run = (data) => {
    const result = rt.execute(type, data, { actor });
    setError(result.ok ? null : result.error);
    toast(result.ok ? `${type} → ${result.events.map((e) => e.type).join(', ')}` : result.error, !result.ok);
    return result;
  };
  return { run, error };
}

/** Navigation between tabs (screen titles); params carry selected ids from one screen into the next. */
function useNav() {
  const { go, params } = useContext(Proto);
  return { go, params };
}

/** For a button the model gives no meaning to — kept, so the screen looks as designed, and flagged. */
function useNotModeled() {
  const { toast } = useContext(Proto);
  return (label) => toast(`"${label}" is not modeled on the board`, true);
}

// The slice blocks use these as globals.
Object.assign(globalThis, { useReadModel, useCommand, useNav, useNotModeled });

// ---------------------------------------------------------------------------------------------
// Chrome

/** A slice part that throws while rendering shows its error instead of taking the tab down. */
class PartBoundary extends Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div className="em-banner">
        Slice "{this.props.slice}" failed to render
        <pre>{String((this.state.error && this.state.error.stack) || this.state.error)}</pre>
      </div>
    );
  }
}

/** Screen tabs: one per screen title, holding every slice's part for that screen in timeline order. */
function screenTabs() {
  const tabs = new Map();
  for (const s of [...Domain.screens].sort((a, b) => a.order - b.order)) {
    if (!tabs.has(s.title)) tabs.set(s.title, { title: s.title, actors: new Set(), parts: [] });
    const tab = tabs.get(s.title);
    if (s.actor) tab.actors.add(s.actor);
    tab.parts.push(s);
  }
  return [...tabs.values()];
}

/** The automations tab: only automations whose todo list has open items show up. */
function AutomationsTab() {
  useLog();
  const due = Object.keys(Domain.automations).map((name) => ({ name, a: Domain.automations[name], todos: rt.todosOf(name) }));
  const open = due.filter((d) => d.todos.length);
  return (
    <div className="em-auto">
      <label>
        <input type="checkbox" checked={rt.autoRun} onChange={(e) => rt.setAutoRun(e.target.checked)} /> run automatically when items appear
      </label>
      {open.length === 0 && <p>Nothing to do — no automation has an open item on its todo list.</p>}
      {open.map(({ name, a, todos }) => (
        <div key={name} className="em-ev em-cmd">
          <b>{name}</b> <span>· {todos.length} open on {a.readModel}{a.external ? ' · calls the outside world' : ''}{a.trigger === 'schedule' ? ' · scheduled' : ''}</span>{' '}
          <button className="em-btn em-on" onClick={() => rt.runAutomations('manual', name)}>Run</button>
          <pre>{JSON.stringify(todos, null, 1)}</pre>
        </div>
      ))}
      {rt.outbox.length > 0 && <h2>Outbox — stubbed calls to the outside world</h2>}
      {rt.outbox.map((o, i) => (
        <div key={i} className="em-ev em-out"><b>{o.automation}</b><pre>{o.effect}</pre></div>
      ))}
      {rt.automationLog.length > 0 && <h2>Runs</h2>}
      {rt.automationLog.map((r, i) => (
        <div key={i} className={'em-ev ' + (r.ok ? 'em-pass' : 'em-fail')}>
          <b>{r.automation}</b> → {r.command} {r.ok ? '✓' : '✗ ' + r.error}
        </div>
      ))}
    </div>
  );
}

/** True when the event carries `value` anywhere in its data (e.g. every event of one order). */
function carries(e, value) {
  return Object.values(e.data || {}).some((v) =>
    v != null && typeof v === 'object' ? JSON.stringify(v).includes(JSON.stringify(value)) : String(v) === String(value),
  );
}

// What the person did (clicks, changed fields), as the board's player recorded it: the player's recorder announces each one as an
// `em-interaction` DOM event ({ at, type, tag, text, path, screen, slice, value? }). Without the player there are none.
let interactions = [];
const interactionListeners = new Set();
function useInteractions() {
  useSyncExternalStore((fn) => { interactionListeners.add(fn); return () => interactionListeners.delete(fn); }, () => interactions);
  return interactions;
}

/** Events and interactions by time; an interaction goes before the events at the same moment — it caused them. */
function mergeTimeline(events, list) {
  return [
    ...list.map((i, n) => ({ kind: 'interaction', at: i.at, rank: 0, n, i })),
    ...events.map((e, n) => ({ kind: 'event', at: Date.parse(e.metadata.at) || 0, rank: 1, n, e })),
  ]
    .sort((a, b) => a.at - b.at || a.rank - b.rank || a.n - b.n)
    .map((x, idx) => Object.assign(x, { idx }));
}
const eventsIn = (timeline, k) => timeline.slice(0, k).filter((x) => x.kind === 'event').length;
const interactionLabel = (i) =>
  (i.type === 'change' ? 'Changed' : i.type === 'submit' ? 'Submitted' : 'Clicked') + ' ' + (i.text ? '“' + i.text.slice(0, 40) + '”' : '<' + i.tag + '>') +
  (i.type === 'change' && i.value !== undefined ? ' to “' + i.value + '”' : '');

// Replaying an interaction: show its screen and outline the element it was about (found again by the path the recorder stored: `tag#id.class > …`
// from <body>, first match; none is fine). With null, only clears.
let highlighted = null;
function focusInteraction(i) {
  if (highlighted) { highlighted.classList.remove('em-hl'); highlighted = null; }
  if (!i) return;
  if (i.screen && navigateTo) navigateTo(i.screen);
  setTimeout(() => { // after the screen switch has rendered
    try {
      const el = document.querySelector('body > ' + i.path);
      if (!el) return;
      highlighted = el;
      el.classList.add('em-hl');
      el.scrollIntoView({ block: 'center', inline: 'nearest' });
    } catch (e) { /* a path that is no selector any more: nothing to show */ }
  }, 250);
}

/**
 * The log, browsable: filter by event type, search, follow one value (click it) through every event
 * carrying it, open an event for its details, and view the screens as of any event.
 */
function EventBrowser({ events }) {
  const [types, setTypes] = useState([]);
  const [search, setSearch] = useState('');
  const [follow, setFollow] = useState(null);
  const [open, setOpen] = useState(null);
  const recorded = useInteractions();
  const [withIx, setWithIx] = useState(false); // include the recorded interactions in the log and the slider
  const [step, setStep] = useState(null);
  const counts = events.reduce((m, e) => ((m[e.type] = (m[e.type] || 0) + 1), m), {});
  const toggle = (t) => setTypes(types.includes(t) ? types.filter((x) => x !== t) : [...types, t]);
  const needle = search.trim().toLowerCase();
  const shown = events.filter(
    (e) =>
      (!types.length || types.includes(e.type)) &&
      (!follow || carries(e, follow.value)) &&
      (!needle || (e.type + ' ' + JSON.stringify(e.data) + ' ' + JSON.stringify(e.metadata)).toLowerCase().includes(needle)),
  );
  const cursor = rt.cursor;
  const timeline = withIx ? mergeTimeline(events, recorded) : null;
  // Interactions show unless the log is narrowed to event types or one followed value (those are about events); the search covers their text.
  const showIx = withIx && !types.length && !follow;
  const rows = showIx
    ? timeline.filter((x) => (x.kind === 'event' ? shown.includes(x.e) : !needle || interactionLabel(x.i).toLowerCase().includes(needle)))
    : (withIx ? timeline.filter((x) => x.kind === 'event' && shown.includes(x.e)) : shown.map((e) => ({ kind: 'event', e })));
  // The slider moves over events (or, with interactions, over both); its value is the number of items shown.
  const total = withIx ? timeline.length : events.length;
  const eventsNow = cursor == null ? events.length : cursor;
  let value = eventsNow;
  if (withIx) {
    value = step != null && eventsIn(timeline, step) === eventsNow ? step : 0;
    if (value !== step) for (let k = timeline.length; k >= 0; k--) if (eventsIn(timeline, k) === eventsNow) { value = k; break; }
  }
  const moveTo = (v) => {
    if (withIx) setStep(v);
    rt.viewAsOf(withIx ? eventsIn(timeline, v) : v);
    const at = withIx && v > 0 ? timeline[v - 1] : null;
    focusInteraction(at && at.kind === 'interaction' ? at.i : null);
  };
  const sliderLabel = !withIx
    ? (cursor == null ? 'now' : cursor === 0 ? 'before the first event' : '#' + cursor + ' ' + (events[cursor - 1] || {}).type)
    : value >= timeline.length ? 'now' : value === 0 ? 'before the first step' : (timeline[value - 1].kind === 'event' ? '#' + eventsIn(timeline, value) + ' ' + timeline[value - 1].e.type : interactionLabel(timeline[value - 1].i));

  return (
    <>
      {cursor != null && (
        <div className="em-ev em-cmd">
          <b>Viewing as of event #{cursor}</b> — screens show the state then; nothing can be recorded.
          <br />
          <button className="em-btn" style={{ marginTop: 6 }} onClick={() => { rt.viewAsOf(null); focusInteraction(null); }}>Back to now</button>
        </div>
      )}
      {follow && (
        <div className="em-ev em-out">
          Following <b>{follow.field} = {String(follow.value)}</b>{' '}
          <button className="em-btn" onClick={() => setFollow(null)}>×</button>
        </div>
      )}
      <div className="em-sect" style={{ margin: '4px 0 0' }}><span className="em-pill">{shown.length === events.length ? `${events.length} event${events.length === 1 ? '' : 's'}` : `${shown.length} of ${events.length} events`}{withIx ? ` · ${recorded.length} interactions` : ''}</span></div>
      {rows.length === 0 && <div className="em-empty">No events yet. Use the prototype and they appear here.</div>}
      {[...rows].reverse().map((row) => {
        if (row.kind === 'interaction') {
          return (
            <div key={'i' + row.idx} className="em-ev em-cmd" style={Object.assign({ cursor: 'pointer' }, row.idx >= value ? { opacity: 0.4 } : null)}
                 title="Show the screen at this step and outline the element" onClick={() => moveTo(row.idx + 1)}>
              <b>{interactionLabel(row.i)}</b>
              <span style={{ float: 'right', color: '#9ca3af' }}>{new Date(row.i.at).toLocaleTimeString()}</span>
              {row.i.screen && <div style={{ color: '#9ca3af' }}>{row.i.screen}{row.i.slice ? ' · ' + row.i.slice : ''}</div>}
            </div>
          );
        }
        const e = row.e;
        const isOpen = open === e.id;
        const future = cursor != null && e.position > cursor;
        return (
          <div key={e.id} className="em-ev" style={future ? { opacity: 0.4 } : null}>
            <div className="em-ev-head" onClick={() => setOpen(isOpen ? null : e.id)}>
              <span className="em-ev-pos">#{e.position}</span>
              <span className="em-ev-type">{e.type}</span>
              {e.metadata.command && <span className="em-ev-from">← {e.metadata.command}</span>}
              {e.metadata.automation && <span className="em-pill">automation</span>}
              {e.metadata.simulated && <span className="em-pill">simulated</span>}
              <span className="em-ev-time">{new Date(e.metadata.at).toLocaleTimeString()}</span>
            </div>
            {Object.keys(e.data || {}).length > 0 && (
              <dl className="em-kv">
                {Object.entries(e.data || {}).flatMap(([k, v]) => {
                  const none = v === '' || v == null || v === undefined || v === 'undefined';
                  return [
                    <dt key={k + 't'}>{k}</dt>,
                    <dd key={k + 'd'} className={none ? 'em-none' : ''}>
                      {none ? '—' : v != null && typeof v === 'object' ? (
                        <code>{JSON.stringify(v)}</code>
                      ) : (
                        <a href="#" title="Show every event carrying this value"
                           onClick={(ev) => { ev.preventDefault(); setFollow({ field: k, value: v }); }}>
                          {String(v)}
                        </a>
                      )}
                    </dd>,
                  ];
                })}
              </dl>
            )}
            {isOpen && (
              <pre>{JSON.stringify(
                Object.assign({ id: e.id, at: e.metadata.at }, e.metadata.command && { command: e.metadata.command },
                  e.metadata.actor && { actor: e.metadata.actor }, e.metadata.automation && { automation: e.metadata.automation },
                  e.metadata.simulated && { simulated: true }), null, 1)}</pre>
            )}
            <div className="em-ev-foot"><button className="em-btn" onClick={() => rt.viewAsOf(e.position)}>View as of here</button></div>
          </div>
        );
      })}
    </>
  );
}

function SimulateForm({ spec }) {
  const [data, setData] = useState(() => Object.fromEntries((spec.fields || []).map((f) => [f.name, f.example ?? ''])));
  return (
    <div className="em-ev em-out">
      <b>{spec.type}</b> {spec.from && <span>from {spec.from}</span>}
      {(spec.fields || []).map((f) => (
        <label key={f.name} style={{ display: 'block' }}>{f.name}
          <input value={data[f.name]} onChange={(e) => setData({ ...data, [f.name]: e.target.value })} />
        </label>
      ))}
      <button className="em-btn" onClick={() => rt.simulate(spec.type, data)}>Simulate</button>
    </div>
  );
}

/** A scenario drawn like the board's spec hover: GIVEN / WHEN headings and the outcome headed SHOWS (a read model) or RESULT (events, commands), a solid chip per event (orange), command or the read model read (blue — WHEN is always blue), the result read model green, an expected error as a dark red box. Names only; the data is in the scenario on the board. */
const SPEC_COLOR = { event: '#f59e0b', command: '#3b82f6', readmodel: '#22c55e', rejected: '#f87171' };
const show = (v) => (v !== null && typeof v === 'object' ? JSON.stringify(v) : String(v));
const words = (name) => String(name || '').replace(/([a-z0-9])([A-Z])/g, '$1 $2');

function SpecChip({ kind, title }) {
  return (
    <div style={{ minWidth: 0 }}>
      <span style={{ display: 'inline-block', background: SPEC_COLOR[kind], color: '#fff', fontWeight: 700, fontSize: 14, padding: '4px 12px', borderRadius: 6, wordBreak: 'break-word' }}>{words(title)}</span>
    </div>
  );
}

function SpecView({ spec }) {
  const ev = (e, i) => <SpecChip key={i} kind="event" title={e.type} />;
  const given = (spec.given || []).map(ev);
  let when = null, then = null, thenKind = 'event';
  if (spec.kind === 'command') {
    when = <SpecChip kind="command" title={(spec.when || {}).type} />;
    if (spec.error !== undefined) thenKind = 'rejected';
    then = spec.error !== undefined ? null : (spec.then || []).map(ev);
  } else if (spec.kind === 'readmodel') {
    when = <SpecChip kind="command" title={spec.readModel} />;
    const rows = Array.isArray(spec.expect) ? spec.expect.length : null;
    then = <SpecChip kind="readmodel" title={rows === 0 ? 'Empty' : rows === 1 ? '1 row' : rows ? rows + ' rows' : 'Data'} />;
    thenKind = 'readmodel';
  } else if (spec.kind === 'automation') {
    when = <SpecChip kind="command" title={spec.automation + ' runs'} />;
    then = (spec.expectCommands || []).map((c, i) => <SpecChip key={i} kind="command" title={c.type} />);
    thenKind = 'command';
  }
  const head = (label, color) => <div style={{ margin: '10px 0 6px', fontSize: 13, fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', color }}>{label}</div>;
  const body = (items) => <div style={{ display: 'flex', flexDirection: 'column', gap: 6, alignItems: 'flex-start' }}>{items}</div>;
  return (
    <div style={{ marginTop: 4 }}>
      {given.length > 0 && <>{head('Given', SPEC_COLOR.event)}{body(given)}</>}
      {head('When', SPEC_COLOR.command)}{body(when)}
      {spec.kind === 'command' && spec.error !== undefined ? (
        <div style={{ marginTop: 10, background: '#2f1213', borderRadius: 6, padding: '8px 12px' }}>
          <div style={{ fontSize: 13, fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', color: SPEC_COLOR.rejected }}>Error expected</div>
          <div style={{ fontSize: 13, color: '#fca5a5', marginTop: 2 }}>{spec.error || 'rejected'}</div>
        </div>
      ) : (<>{head(spec.kind === 'readmodel' ? 'Shows' : 'Result', SPEC_COLOR[thenKind])}{body(then)}</>)}
    </div>
  );
}

function Panel({ slices, open: panelOpen, onToggle }) {
  const events = useLog();
  const [tab, setTab] = useState('events');
  const [specResults] = useState(() => EMRuntime.runSpecs(Domain));
  const [open, setOpen] = useState({}); // scenarios shown as text, by index
  const [allSpecs, setAllSpecs] = useState(false); // scenarios are narrowed to the slices on the current screen unless this is on
  const { toast } = useContext(Proto);
  const [armed, setArmed] = useState(null); // the scenario whose ▶ asked for a second click, because it would replace a log with events in it

  /** Make the prototype show a scenario's starting state: the event log becomes its `given` events. */
  const playGiven = (spec, i) => {
    if (rt.events.length > 0 && armed !== i) {
      setArmed(i);
      toast('This replaces the current event log — click ▶ again to go on');
      return;
    }
    setArmed(null);
    const at = new Date().toISOString();
    const given = spec.given || [];
    rt.importLog(given.map((e) => ({ id: EMRuntime.uuid(), type: e.type, data: e.data || {}, metadata: { at, scenario: spec.title } })));
    toast(given.length ? `Played ${given.length} given event${given.length === 1 ? '' : 's'} — the screens show that state` : 'This scenario starts from nothing — the event log is empty');
  };
  // Only the scenarios of the slices shown on the current screen (`slices` is null on the Automations tab: everything).
  const shownSpecs = specResults.map((r, i) => [r, i]).filter(([r]) => allSpecs || !slices || slices.includes(r.spec.slice));
  if (!panelOpen) {
    return (
      <aside className="em-panel em-collapsed" data-em-chrome="">
        <button className="em-toggle" onClick={onToggle} title="Show the events, simulate, specs and clock panel" aria-label="Show panel">‹</button>
        <div className="em-vlabel" onClick={onToggle}>events · simulate · specs · clock</div>
      </aside>
    );
  }
  return (
    <aside className="em-panel" data-em-chrome="">
      <div className="em-tabs">
        <button className="em-toggle" onClick={onToggle} title="Hide the panel" aria-label="Hide panel" style={{ alignSelf: 'center', marginRight: 6 }}>›</button>
        {['events', 'simulate', 'specs', 'clock'].map((t) => (
          <button key={t} className={tab === t ? 'em-active' : ''} onClick={() => setTab(t)}>{t}</button>
        ))}
      </div>

      {tab === 'events' && (
        <>
          <div className="em-sect"><h2>Event log</h2><button className="em-btn" onClick={() => rt.reset()}>Reset</button></div>
          <EventBrowser events={events} />
        </>
      )}

      {tab === 'simulate' && (
        <>
          <h2>Events from outside this context</h2>
          {Domain.externalEvents.length === 0 && <p>None — everything this context reads, it records itself.</p>}
          {Domain.externalEvents.map((x) => <SimulateForm key={x.type} spec={x} />)}
        </>
      )}

      {tab === 'specs' && (
        <>
          <div className="em-sect">
            <div>
              <h2>Scenarios</h2>
              {slices && <div className="em-sub">{allSpecs ? 'All screens' : 'This screen'} · {shownSpecs.length} of {specResults.length}</div>}
            </div>
            {slices && <button className="em-btn" onClick={() => setAllSpecs(!allSpecs)}>{allSpecs ? 'This screen only' : 'Show all'}</button>}
          </div>
          {shownSpecs.length === 0 && <div className="em-empty">No scenarios for this screen.</div>}
          {shownSpecs.map(([r, i]) => (
            <div key={i} className={'em-ev ' + (r.pass ? 'em-pass' : 'em-fail')} style={{ display: 'flex', alignItems: 'flex-start', gap: 6 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ cursor: 'pointer', display: 'flex', gap: 6 }} onClick={() => setOpen({ ...open, [i]: !open[i] })} title="Show or hide the scenario as text">
                  <span className="em-chev" style={{ marginTop: 3 }}>{open[i] ? '▼' : '▶'}</span>
                  <div style={{ minWidth: 0 }}>
                    <div className="em-spec-title">{r.spec.title}</div>
                    <div className="em-spec-meta"><span className={'em-pill ' + (r.pass ? 'em-pass' : 'em-fail')}>{r.pass ? '✓ Passing' : '✗ Failing'}</span> <span style={{ marginLeft: 4 }}>{r.spec.slice}</span></div>
                  </div>
                </div>
                {open[i] && <SpecView spec={r.spec} />}
                {!r.pass && <pre>{r.detail}</pre>}
              </div>
              <button className={'em-btn em-icon' + (armed === i ? ' em-on' : '')} style={{ flex: 'none' }} onClick={() => playGiven(r.spec, i)}
                      title="Play the given events: the screens show this scenario's starting state">▶</button>
              {r.spec.sliceId && (
                <button className="em-btn em-icon" style={{ flex: 'none' }} onClick={() => EMRuntime.zoomToSlice(r.spec.sliceId)}
                        title="Show this scenario's slice on the board"><span aria-hidden>◎</span></button>
              )}
            </div>
          ))}
        </>
      )}

      {tab === 'clock' && (
        <>
          <h2>Clock</h2>
          <p>{rt.now().toLocaleString()}</p>
          {[['+1 hour', 3600e3], ['+1 day', 864e5], ['+7 days', 7 * 864e5], ['+30 days', 30 * 864e5]].map(([l, ms]) => (
            <button key={l} className="em-btn" style={{ marginRight: 4 }} onClick={() => rt.advanceClock(ms)}>{l}</button>
          ))}
          <p style={{ color: '#9ca3af' }}>Items that fall due appear in the Automations tab.</p>
        </>
      )}
    </aside>
  );
}

const AUTOMATIONS = '__automations__';

function App() {
  useLog();
  const tabs = screenTabs();
  const [current, setCurrent] = useState(() => ({ title: (tabs[0] || {}).title || AUTOMATIONS, params: {} }));
  const [actor, setActor] = useState('');
  const [panelOpen, setPanelOpen] = useState(false); // the side panel starts contracted
  // Slice outlines on or off — remembered when the page may keep it (the board's player sandboxes the page without storage).
  const [outline, setOutline] = useState(() => { try { return localStorage.getItem('em-outline') !== '0'; } catch (e) { return true; } });
  const toggleOutline = (on) => { setOutline(on); try { localStorage.setItem('em-outline', on ? '1' : '0'); } catch (e) { /* no storage */ } };
  const embedded = window.parent !== window; // only inside the board's player can a slice be zoomed to
  const [toastMsg, setToastMsg] = useState(null);
  const toast = (text, error) => {
    setToastMsg({ text, error });
    clearTimeout(toast.t);
    toast.t = setTimeout(() => setToastMsg(null), 2800);
  };
  const go = (title, params) => setCurrent({ title, params: params || {} });
  navigateTo = go;
  // The screen shown, for the board's feedback recorder (a declarative marker, read from outside the page).
  React.useEffect(() => { document.body.dataset.emScreen = current.title; });
  const actors = [...new Set(tabs.flatMap((t) => [...t.actors]))];
  const visible = tabs.filter((t) => !actor || t.actors.has(actor));
  const tab = tabs.find((t) => t.title === current.title);
  const openTodos = Object.keys(Domain.automations).reduce((n, name) => n + rt.todosOf(name).length, 0);

  return (
    <Proto.Provider value={{ go, params: current.params, toast, actor: actor || null }}>
      <div className="em-shell" style={{ gridTemplateColumns: `minmax(0, 1fr) ${panelOpen ? 440 : 44}px` }}>
        <div className="em-main">
          <header className="em-bar">
            <h1>
              {/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(Domain.context) ? '' : Domain.context /* a context without a name is never shown as its id */}
              {actors.length > 1 && (
                <select value={actor} onChange={(e) => setActor(e.target.value)} title="Acting as">
                  <option value="">every role</option>
                  {actors.map((a) => <option key={a} value={a}>{a}</option>)}
                </select>
              )}
              <label className="em-outline-toggle" title="Outline each slice with a badge showing its name">
                <input type="checkbox" checked={outline} onChange={(e) => toggleOutline(e.target.checked)} /> slices
              </label>
              {rt.cursor != null && <span style={{ color: '#93c5fd', fontSize: 12 }}>viewing as of event #{rt.cursor}</span>}
            </h1>
            <nav className="em-tabbar">
              {visible.map((t) => (
                <button key={t.title} className={t.title === current.title ? 'em-active' : ''} onClick={() => go(t.title)}>{t.title}</button>
              ))}
              {Object.keys(Domain.automations).length > 0 && (
                <button className={current.title === AUTOMATIONS ? 'em-active' : ''} onClick={() => go(AUTOMATIONS)}>
                  Automations{openTodos > 0 && <span className="em-count">{openTodos}</span>}
                </button>
              )}
            </nav>
          </header>
          <main className={'em-stage' + (outline ? ' em-outline' : '')}>
            {current.title === AUTOMATIONS ? (
              <AutomationsTab />
            ) : tab ? (
              tab.parts.map((p) => (
                <div key={p.slice} className="em-part" data-em-slice={p.slice}>
                  {outline ? (
                    <div className="em-badge">
                      <span title={p.slice}>{p.slice}</span>
                      {embedded && p.sliceId && <button onClick={() => EMRuntime.zoomToSlice(p.sliceId)} title="Show this slice on the board" aria-label={'Show ' + p.slice + ' on the board'}>◎</button>}
                    </div>
                  ) : tab.parts.length > 1 && <div className="em-part-label">{p.slice}</div>}
                  <PartBoundary key={JSON.stringify(current.params)} slice={p.slice}>
                    <p.part params={current.params} />
                  </PartBoundary>
                </div>
              ))
            ) : (
              <p>This context has no screens — drive it from the Automations tab and the simulate panel.</p>
            )}
          </main>
        </div>
        <Panel slices={tab ? tab.parts.map((p) => p.slice) : null} open={panelOpen} onToggle={() => setPanelOpen((o) => !o)} />
      </div>
      {toastMsg && <div className={'em-toast' + (toastMsg.error ? ' em-error' : '')}>{toastMsg.text}</div>}
    </Proto.Provider>
  );
}

/**
 * The message contract with the board's player (feedback + replay). Only the embedding page may talk to it; everything else is ignored.
 *   player → page  { source: 'proto-host', type: 'events-request', id }   → { source: 'proto-kit', type: 'events', id, events, cursor }
 *                  { source: 'proto-host', type: 'load', events }          replace the log (a replay starts from a recorded one)
 *                  { source: 'proto-host', type: 'view', position }        show the state as of event #position (null = now)
 *                  { source: 'proto-host', type: 'screen', title }         switch to that screen's tab
 *   page → player  { source: 'proto-kit', type: 'ready' }                  once mounted
 * Interactions arrive the other way round, in the page itself: the player's recorder dispatches an `em-interaction` DOM event for each (see useInteractions).
 * [data-em-chrome] marks the kit's own tooling (the side panel): the player's recorder ignores what happens inside it.
 * The screen and the slice are read from the DOM: <body data-em-screen> and the nearest [data-em-slice].
 */
globalThis.emMount = () => {
  rt = EMRuntime.createRuntime(Domain);
  rt.subscribe(() => version++);
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (e.source !== window.parent || !d || d.source !== 'proto-host') return;
    if (d.type === 'events-request') window.parent.postMessage({ source: 'proto-kit', type: 'events', id: d.id, events: rt.events, cursor: rt.cursor }, '*');
    else if (d.type === 'load') rt.importLog(Array.isArray(d.events) ? d.events : []);
    else if (d.type === 'view') rt.viewAsOf(typeof d.position === 'number' ? d.position : null);
    else if (d.type === 'screen' && navigateTo) navigateTo(String(d.title));
  });
  // A question is about to be shown (the player's feedback layer announces it with this DOM event): put the prototype in the state the question
  // asks about — the event log becomes the `given` events of the model's scenario it names (setup.spec: its title or id) or of the inline ones
  // (setup.given), as ▶ in the specs panel does — and show its screen.
  document.addEventListener('em-question', (e) => {
    const q = EMRuntime.questions().find((x) => x.id === e.detail?.id);
    if (!q) return;
    if (q.setup) {
      const spec = q.setup.spec ? (Domain.specs || []).find((x) => x.id === q.setup.spec || x.title === q.setup.spec) : null;
      const given = spec ? spec.given || [] : Array.isArray(q.setup.given) ? q.setup.given.filter((x) => x && x.type) : [];
      const at = new Date().toISOString();
      rt.importLog(given.map((x) => ({ id: EMRuntime.uuid(), type: x.type, data: x.data || {}, metadata: { at, scenario: spec ? spec.title : q.id } })));
    }
    if (q.screen && navigateTo && q.screen !== document.body.dataset.emScreen) navigateTo(q.screen);
  });
  // Deferred a tick: the recorder announces a click before the page has handled it, and a synchronous re-render in the middle of
  // the event would reset a controlled checkbox before React reads it.
  document.addEventListener('em-interaction', (e) => {
    const item = e.detail;
    setTimeout(() => {
      interactions = [...interactions, item].slice(-200);
      interactionListeners.forEach((fn) => fn());
    }, 0);
  });
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  window.parent.postMessage({ source: 'proto-kit', type: 'ready' }, '*');
};
</script>

<!-- ============================================================================================
     @@SLICES@@ — one block per slice, inserted by `prototype.mjs assemble`: a text/plain script
     carrying the slice's id, title and hash as data attributes, whose body calls EMRuntime.defineSlice.
     A block is regenerated only when its slice's hash changed — the hash on the block is how the next
     run knows. Contract: assets/slices.example.html.
     ============================================================================================ -->

<!-- Load: compile the kit, then every slice block on its own, run the scenarios, mount. A failure shows
     as a red banner naming the slice, never as a blank page. -->
<script>
(function () {
  const banner = document.getElementById('em-banner');
  const show = (title, detail) => {
    const box = document.createElement('div');
    box.className = 'em-banner';
    box.textContent = title;
    if (detail) {
      const pre = document.createElement('pre');
      pre.textContent = detail;
      box.appendChild(pre);
    }
    banner.appendChild(box);
  };
  const run = (src) => new Function(Babel.transform(src, { presets: ['react'] }).code)();

  if (!globalThis.EMRuntime) return show('The prototype did not load', 'The runtime block failed to run — see the browser console.');
  try {
    run(document.getElementById('em-kit').textContent);
  } catch (err) {
    return show('The prototype kit failed to start', err.message);
  }
  for (const block of document.querySelectorAll('script[data-em-slice]')) {
    try {
      run(block.textContent);
    } catch (err) {
      show(`Slice "${block.dataset.emTitle}" does not load — the rest of the prototype works without it`, err.message);
    }
  }
  const failed = EMRuntime.runSpecs(EMRuntime.domain).filter((r) => !r.pass);
  if (failed.length) {
    show(
      `${failed.length} scenario${failed.length === 1 ? '' : 's'} from the board fail`,
      failed.map((r) => `✗ [${r.spec.slice || '-'}] ${r.spec.title}\n   ${r.detail}`).join('\n'),
    );
  }
  emMount();
})();
</script>
</body>
