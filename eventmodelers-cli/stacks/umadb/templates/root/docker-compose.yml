services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=quickstart
      - POSTGRES_USER=quickstart
      - POSTGRES_PASSWORD=quickstart
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickstart"]
      interval: 10s
      timeout: 5s
      retries: 10

  umadb:
    image: umadb/umadb:latest
    ports:
      - "50051:50051"
    volumes:
      - umadb-data:/data

volumes:
  postgres-data:
    driver: local
  umadb-data:
    driver: local
